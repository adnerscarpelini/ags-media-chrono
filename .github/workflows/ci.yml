name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  testes:
    name: testes (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Bibliotecas do sistema (Qt, Perl)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends perl libegl1 libgl1 \
            libxkbcommon0 libxkbcommon-x11-0 libfontconfig1 libdbus-1-3 libglib2.0-0 \
            libxcb-cursor0 libpulse0

      - name: Dependências Python
        run: pip install -e ".[dev]"

      - name: Cache do ExifTool e FFmpeg
        uses: actions/cache@v4
        with:
          path: tools/bin
          key: ferramentas-${{ runner.os }}-${{ hashFiles('tools/baixar_ferramentas.py') }}

      - name: ExifTool e FFmpeg
        run: python tools/baixar_ferramentas.py

      - name: Lint
        run: |
          ruff check .
          ruff format --check .

      - name: Testes
        run: pytest -q
