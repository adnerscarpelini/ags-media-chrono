name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
  # Valida o empacotamento em PRs que mexem nele (sem publicar nada).
  pull_request:
    paths:
      - "empacotamento/**"
      - "tools/empacotar.py"
      - "tools/baixar_ferramentas.py"
      - ".github/workflows/release.yml"

permissions:
  contents: write

jobs:
  pacotes:
    name: pacote (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-22.04]  # 22.04: AppImage compatível com distros mais antigas
    env:
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Bibliotecas do sistema (Qt, Perl, AppImage)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends perl file libegl1 libgl1 \
            libxkbcommon0 libxkbcommon-x11-0 libfontconfig1 libdbus-1-3 libglib2.0-0 \
            libxcb-cursor0 libpulse0

      - name: Dependências Python
        run: pip install -e ".[dev]"

      - name: Gerar pacote
        run: python tools/empacotar.py --sem-appimage

      - name: AppImage
        if: runner.os == 'Linux'
        continue-on-error: true
        run: python -c "import sys; sys.path.insert(0, 'tools'); import empacotar as e; e.appimage(e.DIST / e.NOME)"

      - uses: actions/upload-artifact@v4
        with:
          name: pacote-${{ matrix.os }}
          path: |
            dist/ags-media-chrono-*.zip
            dist/ags-media-chrono-*.tar.gz
            dist/ags-media-chrono-*.AppImage
          if-no-files-found: error

  publicar:
    needs: pacotes
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: pacotes
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: pacotes/*
          generate_release_notes: true
