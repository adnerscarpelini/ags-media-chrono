[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "ags-media-chrono"
dynamic = ["version"]
description = "Organize datas de fotos e vídeos e renomeie em lote — Windows e Linux"
readme = "README.md"
license = "MIT"
authors = [{ name = "Adner Scarpelini" }]
requires-python = ">=3.11"
dependencies = [
    "PySide6>=6.9",
    "Pillow>=10.0",
    "pillow-heif>=0.16",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
    "pyinstaller>=6.10",
]

[project.gui-scripts]
ags-media-chrono = "ags_media_chrono.app:main"

[tool.setuptools.dynamic]
version = { attr = "ags_media_chrono.__version__" }  # única fonte da versão

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ags_media_chrono = ["recursos/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]  # helpers como tests/amostras.py

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
